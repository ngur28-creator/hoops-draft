<title>PitchRank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: search-first top bar over a 1240px column. Home opens on the points table itself (ranked list + spotlight sheet).
   Colour comes from the clubs' own kit colours; the interface stays navy and white with one hi-vis orange signal. */
:root{
  /* Night-match palette: deep navy floodlit sky, white type, one electric-cyan signal. Club kit colours supply the rest. */
  --paper:#050a2c; --card:#0b1442; --sunk:#111c55; --line:#1e2b6c; --ink:#f4f6ff; --muted:#9ba7da;
  --signal:#00d1ff; --signal-soft:rgba(0,209,255,.14); --signal-ink:#03102e;
  --pitch:#0d6a46; --pitch-2:#0b5d3d; --chalk:rgba(255,255,255,.45);
  --good:#3ee08f; --bad:#ff6b6b; --gold:#ffd25a;
  --seg1:#00d1ff; --seg2:#7aa2ff; --seg3:#b28cff; --seg4:#3ee08f; --seg5:#ff9bd2; --seg6:#ffd25a; --seg7:#56649f;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -20px rgba(0,0,0,.7);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{background:radial-gradient(1100px 520px at 78% -8%,rgba(40,80,220,.55),transparent 62%),radial-gradient(900px 480px at -5% 0%,rgba(90,40,200,.45),transparent 58%),var(--paper);background-attachment:fixed;min-height:100%}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.55;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 36% 8%,#cfe 50%,transparent 52%),radial-gradient(1.4px 1.4px at 64% 22%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 82% 12%,#bdf 50%,transparent 52%),radial-gradient(1px 1px at 92% 36%,#fff 50%,transparent 52%),radial-gradient(1.2px 1.2px at 6% 44%,#fff 50%,transparent 52%),radial-gradient(1px 1px at 48% 40%,#cdf 50%,transparent 52%);background-size:620px 420px}
#themeBtn{display:none!important}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#050a2c}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.n{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display)}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display);letter-spacing:-.01em;line-height:1.08}
h1{font-size:clamp(28px,4.4vw,48px);font-weight:800}
h2{font-size:clamp(22px,2.8vw,30px);font-weight:800}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(5,10,44,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 20px;align-items:center;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:-.02em}
.search{position:relative;max-width:560px;width:100%;justify-self:center}
.search input{width:100%;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--sunk);padding:0 16px 0 44px;font-size:15px}
.search input:focus{border-color:var(--signal);background:var(--card);outline:none}
.search>svg{position:absolute;left:15px;top:14px;color:var(--muted);pointer-events:none}
.drop{position:absolute;left:0;right:0;top:50px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:min(70vh,560px);overflow:auto;padding:6px;z-index:70}
.drop .grp{padding:10px 10px 4px;font-size:12px;color:var(--muted);font-weight:600}
.drop button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px}
.drop button:hover,.drop button.on{background:var(--sunk)}
.drop .sub{color:var(--muted);font-size:13px}
.tools{display:flex;gap:6px}
.ib{height:40px;min-width:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-weight:600}
.ib:hover{border-color:var(--ink)}
.tabs{grid-column:1/-1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:12px 12px 13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--signal)}
@media (max-width:760px){.top .wrap{grid-template-columns:minmax(0,1fr) auto}.search{grid-column:1/-1;grid-row:2;max-width:none}.lang-name{display:none}}

main{padding-block:28px 72px}
.view{display:grid;gap:40px;grid-template-columns:minmax(0,1fr)}
.view>*,.sec>*,.hero-head>*{min-width:0}
.sec{display:grid;gap:16px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--signal);font-weight:600}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;color:var(--muted)}

/* chips & filters */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#050a2c;border-color:var(--ink)}
.agebar{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:14px;width:max-content;max-width:100%;overflow-x:auto}
.agebar button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;font-family:var(--display);font-size:13px;color:var(--muted);white-space:nowrap}
.agebar button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink)}
select.sel{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;max-width:100%;font-weight:500}

/* crest + avatar */
.crest{flex:none;display:inline-block}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.01em;box-shadow:inset 0 0 0 2.5px var(--ring,transparent)}
.pos{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}

/* hero table */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-head,.hero>*{min-width:0}
.hero-head{display:grid;gap:14px;grid-column:1/-1}
.hero-head p{margin:0;max-width:62ch;color:var(--muted);font-size:16px}
.ranklist{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:var(--shadow)}
.rk{display:grid;grid-template-columns:52px 34px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:10px 12px}
.rk:hover{background:var(--sunk)}
.rk[aria-selected="true"]{background:var(--signal-soft);box-shadow:inset 3px 0 0 var(--signal)}
.rk .num{font-family:var(--display);font-weight:800;font-size:26px;color:var(--muted);text-align:center;line-height:1}
.rk:nth-child(1) .num{color:var(--signal);font-size:32px}
.rk .who{min-width:0;display:grid;gap:3px}
.rk .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .sb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .meter{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:3px}
.rk .meter i{display:block;height:100%;background:var(--ink);border-radius:4px;opacity:.85}
.rk:nth-child(1) .meter i{background:var(--signal);opacity:1}
.rk .pts{font-family:var(--display);font-weight:700;font-size:20px;text-align:right}
.rk .pts small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:500}
@media (max-width:520px){.rk{grid-template-columns:36px 30px minmax(0,1fr) auto;gap:10px;padding:9px 8px}.rk .num{font-size:20px}.rk:nth-child(1) .num{font-size:24px}.rk .pts{font-size:17px}}

/* spotlight sheet */
.spot{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);position:sticky;top:120px}
@media (max-width:980px){.spot{position:static}}
.kit{position:relative;padding:22px 22px 20px;color:var(--kit-ink,#fff);background:var(--kit,#0d1b3e);overflow:hidden;min-height:150px}
.kit::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,var(--kit2,rgba(255,255,255,.12)) 26px 36px);opacity:.2;pointer-events:none}
.kit>*{position:relative}
.kit .club{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;opacity:.95}
.kit h2{font-size:clamp(26px,3.2vw,36px);font-weight:900;margin-top:14px;line-height:1}
.kit .meta{margin-top:8px;font-size:14px;opacity:.9;display:flex;flex-wrap:wrap;gap:4px 14px}
.kit .big{position:absolute;right:20px;bottom:16px;text-align:right}
.kit .big b{font-family:var(--display);font-size:clamp(40px,5vw,60px);font-weight:900;line-height:.9;display:block}
.kit .big span{font-size:13px;opacity:.85}
.spot-body{padding:18px 22px 22px;display:grid;gap:16px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.kv div{background:var(--card);padding:10px 12px}
.kv b{display:block;font-family:var(--display);font-size:18px;font-weight:700}
.kv span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.kv{grid-template-columns:repeat(2,1fr)}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 10px;display:grid;gap:4px;align-content:start}
.tile-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.tile-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:20px 30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 6px;border-radius:10px;background:none;border:0;width:100%;text-align:left}
.row:hover{background:var(--sunk)}
.row .r{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-family:var(--display);font-weight:700;font-size:15px}
.row .av{width:30px;height:30px;font-size:11px}

/* week strip */
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.wk{scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;text-align:left}
.wk:hover{border-color:var(--ink)}
.wk .top-l{display:flex;justify-content:space-between;align-items:center}
.wk .p{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.wk .nm{font-weight:700}
.wk .ln{font-size:13px;color:var(--muted)}
.wk .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sunk)}
.tag.hot{background:var(--signal-soft);color:var(--signal)}

/* leagues */
.lgroup{display:grid;gap:10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lg{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px}
.lg:hover{border-color:var(--ink)}
.flag{font-size:22px;line-height:1;width:28px;text-align:center;flex:none}
.lg .ln{font-weight:700}
.lg .ls{font-size:12px;color:var(--muted)}

/* table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:11px 12px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
th.sort{cursor:pointer}
th.on{color:var(--ink)}
td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
.r{text-align:right}
td.lead{font-family:var(--display);font-weight:700;color:var(--signal)}
td.rank{font-family:var(--display);font-weight:700;color:var(--muted);width:44px}
.pc{display:flex;align-items:center;gap:10px}
.pc .nm{font-weight:600}
.pc .sb{font-size:12px;color:var(--muted)}
.more{justify-self:center}
.filters{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.frow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.flabel{font-size:13px;font-weight:600;color:var(--muted);min-width:96px}
.spark{display:block}

/* sheet (modal) */
.scrim{position:fixed;inset:0;background:rgba(6,12,28,.55);z-index:80;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 24px max(10px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border-radius:24px;width:min(960px,100%);overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.sheet .x{position:absolute;right:14px;top:14px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px;line-height:1}
.sheet .kit{padding:26px 26px 24px;min-height:190px}
.sheet .kit h2{font-size:clamp(30px,5vw,52px)}
.sheet-body{padding:22px 26px 28px;display:grid;gap:26px}
@media (max-width:520px){.sheet .kit{padding:22px 18px}.sheet-body{padding:18px 16px 24px}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:20px;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}
.pct{display:grid;gap:10px}
.pct-row{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:14px}
.pct-row .tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.pct-row .tr i{display:block;height:100%;border-radius:5px}
.pct-row b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.pct-row{grid-template-columns:104px minmax(0,1fr) 36px;font-size:13px}}
.res{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.res.w{background:var(--good)}.res.d{background:var(--muted)}.res.l{background:var(--bad)}
.formchart{display:block;width:100%;height:auto}
.split{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.split>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.split b{font-family:var(--display);font-size:18px}

/* pitch */
.pitch{position:relative;border-radius:22px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch) 0 11.11%,var(--pitch-2) 11.11% 22.22%);padding:30px 10px;display:grid;gap:26px;max-width:760px;width:100%;margin:0 auto}
.pitch .ln{position:absolute;pointer-events:none;border:2px solid var(--chalk)}
.pitch .ln.o{inset:12px;border-radius:4px}
.pitch .ln.h{left:12px;right:12px;top:50%;height:0;border-width:2px 0 0}
.pitch .ln.c{left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%}
.pitch .ln.bt{left:26%;right:26%;top:12px;height:13%;border-top:0}
.pitch .ln.bb{left:26%;right:26%;bottom:12px;height:13%;border-bottom:0}
.line{display:flex;justify-content:space-around;position:relative;z-index:1;gap:4px}
.pp{display:grid;justify-items:center;gap:5px;background:none;border:0;padding:0;color:#fff;width:100px}
.pp .av{width:50px;height:50px;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 3px var(--ring,#fff)}
.pp .pn{font-size:12px;font-weight:700;background:rgba(5,15,10,.6);padding:2px 8px;border-radius:7px;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .pv{font-family:var(--display);font-size:12px;font-weight:700;color:#ffd9a8}
@media (max-width:520px){.pp{width:74px}.pp .av{width:40px;height:40px;font-size:13px}.pp .pn{max-width:74px;font-size:11px}}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.cslot{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;align-content:start}
.mini{position:relative}
.mini input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);padding:0 14px}
.crow{display:grid;grid-template-columns:64px minmax(0,1fr) 130px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.crow .lbl{text-align:center;color:var(--muted);font-size:13px}
.crow .v{font-family:var(--display);font-weight:700;font-size:14px}
.crow .v.w{color:var(--signal)}
.crow .bl,.crow .br{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;display:flex}
.crow .bl{justify-content:flex-end}
.crow .bl i,.crow .br i{display:block;height:100%;background:var(--muted);border-radius:5px;opacity:.5}
.crow i.w{background:var(--signal);opacity:1}
@media (max-width:640px){.crow{grid-template-columns:44px minmax(0,1fr) 92px minmax(0,1fr) 44px;font-size:12px}.crow .lbl{font-size:12px}}
.radar{display:block;margin:0 auto;max-width:360px;width:100%;height:auto}

/* games */
.games{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:920px){.games{grid-template-columns:1fr}}
.game{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:14px;align-content:start}
.hl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.hlc{border-radius:18px;overflow:hidden;display:grid;text-align:center;border:1px solid var(--line)}

/* =============== fantasy =============== */
const FSL=['G','G','D','D','D','D','D','M','M','M','M','M','F','F','F'];
let FAN=null;try{FAN=JSON.parse(ls.get('pr4_fantasy')||'null')}catch(e){}
let FPRICE=null;
function fprice(i){if(!FPRICE){FPRICE=new Map();const A=agg({comp:'all',since:JUL1});for(const pos of 'GDMF'){const r=A.filter(a=>a.p.pos===pos&&a.apps).sort((x,y)=>x.pts-y.pts);r.forEach((a,k)=>FPRICE.set(a.p.i,Math.round((4+(pos==='G'?6:8.5)*Math.pow(k/Math.max(1,r.length-1),2.4))*2)/2))}}return FPRICE.get(i)||4}
function fdraft(){if(!S.fd){const v=FAN&&FAN.versions&&FAN.versions.length?FAN.versions[FAN.versions.length-1]:null;S.fd=v?{squad:v.squad.map(id=>{const p=PI.get(id);return p?p.i:null}),bench:[...v.bench],cap:v.cap!=null&&PI.get(v.cap)?PI.get(v.cap).i:null,name:FAN.name||''}:{squad:Array(15).fill(null),bench:[1,6,11,14],cap:null,name:''}}return S.fd}
function xiOk(d){const c={G:0,D:0,M:0,F:0};d.squad.forEach((id,k)=>{if(!d.bench.includes(k))c[FSL[k]]++});return c.G===1&&c.D>=3&&c.D<=5&&c.M>=2&&c.M<=5&&c.F>=1&&c.F<=3}
function weekStart(ts){const d=new Date(ts*1000);const day=(d.getUTCDay()+6)%7;return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-day)/1000}
function fscore(versions){const md=new Map();let total=0;
  versions.forEach((v,k)=>{const from=v.ts,to=k+1<versions.length?versions[k+1].ts:Infinity;
    v.squad.forEach((id,slot)=>{if(v.bench.includes(slot))return;const p=PI.get(id);if(!p)return;for(const m of p.ms){const ts=EV[m[0]].ts;if(ts<from||ts>=to)continue;const pts=m.pts*(id===v.cap?2:1);total+=pts;const w=weekStart(ts);md.set(w,(md.get(w)||0)+pts)}})});
  return{total,md:[...md.entries()].sort((a,b)=>a[0]-b[0])}}
function fval(d){return d.squad.reduce((s,i)=>s+(i==null?0:fprice(i)),0)}
function fclubCount(d,team){return d.squad.filter(i=>i!=null&&PL[i].team===team).length}
function fslot(d,k){const i=d.squad[k];const sel=S.fsel===k;if(i==null)return`<button class="fslot ${sel?'sel':''}" data-fslot="${k}"><span class="empty">+</span><span class="pn">${t('pos_'+FSL[k])}</span></button>`;
  const p=PL[i],A=aggAll()[i];return`<button class="fslot ${sel?'sel':''}" data-fslot="${k}">${d.cap===i?'<span class="cap">C</span>':''}${av(p)}<span class="pn">${esc(p.short||p.name)}</span><span class="pv n">${fprice(i).toFixed(1)}m · ${A.pts}</span></button>`}

  const mx=Math.max(1,...sc.md.map(x=>x[1]));
  const code=saved?btoa(unescape(encodeURIComponent(JSON.stringify({n:FAN.name||'',v:saved[saved.length-1]})))):'';
  app.innerHTML=`<div class="view"><div class="sec"><h1>${esc(t('fan_title'))}</h1><p class="muted" style="margin:0;max-width:70ch">${esc(t('fan_sub'))}</p></div>

   <div class="fstat" style="grid-template-columns:1fr 1fr"><div><b class="n">${val.toFixed(1)}m</b><span>${esc(t('fan_value'))}</span></div><div><b class="n" style="${left<0?'color:var(--bad)':''}">${left.toFixed(1)}m</b><span>${esc(t('fan_left'))}</span></div></div>
   <div class="mini"><input id="fname" placeholder="${esc(t('fan_name'))}" value="${esc(d.name||'')}" maxlength="30"></div>

  out.sort((a,b)=>a.s-b.s);return out.slice(0,n).map(x=>x.p)}

function radar(a,b){const peers=aggAll().filter(x=>x.min>=450);const axes=[['goals',x=>x.g],['xg',x=>x.xg],['assists',x=>x.a],['kp',x=>x.kp],['drb',x=>x.drb],['ti',x=>x.ti],['clr',x=>x.clr],['points',x=>x.pts]];
  const pr=(x,f)=>{const v=f(x)*90/Math.max(1,x.min);const vals=peers.map(y=>f(y)*90/Math.max(1,y.min));return vals.filter(z=>z<v).length/vals.length};
  const R=120,cx=170,cy=150,N=axes.length;const pt=(i,r)=>[cx+Math.sin(i/N*2*Math.PI)*r,cy-Math.cos(i/N*2*Math.PI)*r];
  const poly=(x,col,op)=>`<polygon points="${axes.map(([,f],i)=>pt(i,Math.max(.04,pr(x,f))*R).join(',')).join(' ')}" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="2"/>`;
  return`<svg class="radar" viewBox="0 0 340 310" role="img" aria-label="${esc(t('cmp_radar'))}">${[.25,.5,.75,1].map(f=>`<polygon points="${axes.map((_,i)=>pt(i,f*R).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('')}${axes.map(([k],i)=>{const [x,y]=pt(i,R+18);return`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="var(--muted)">${esc(t(k))}</text>`}).join('')}${poly(a,'var(--signal)',.22)}${poly(b,'var(--seg3)',.22)}</svg>`}

let HL_POOL=null;
function hlPick(not){if(!HL_POOL)HL_POOL=aggAll().filter(a=>a.apps).sort((x,y)=>y.pts-x.pts).slice(0,300);let a;do{a=HL_POOL[Math.floor(Math.random()*HL_POOL.length)]}while(not&&(a===not||a.pts===not.pts));return a}
const B5=42,B5S=['G','D','M','M','F'];
let PRICE=null;function price(i){if(!PRICE){const A=aggAll();const ranked=A.filter(a=>a.apps).sort((x,y)=>x.pts-y.pts);PRICE=new Map();ranked.forEach((a,k)=>PRICE.set(a.p.i,Math.round((4+9.5*Math.pow(k/(ranked.length-1),3))*2)/2))}return PRICE.get(i)||4}

function b5best(){const A=aggAll(),U=B5*2;const cand=pos=>A.filter(a=>a.p.pos===pos&&a.apps).sort((x,y)=>y.pts-x.pts).slice(0,70);
  const single=pos=>cand(pos).map(a=>({ids:[a.p.i],c:price(a.p.i)*2,p:a.pts,pc:a.pts*2}));const mids=cand('M').slice(0,55),pairs=[];
  for(let i=0;i<mids.length;i++)for(let j=i+1;j<mids.length;j++){const x=mids[i],y=mids[j];pairs.push({ids:[x.p.i,y.p.i],c:(price(x.p.i)+price(y.p.i))*2,p:x.pts+y.pts,pc:x.pts+y.pts+Math.max(x.pts,y.pts)})}
  let dp=[new Map([[0,{v:0,pick:[]}]]),new Map()];
  for(const g of [single('G'),single('D'),pairs,single('F')]){const nd=[new Map(),new Map()];
    for(let cu=0;cu<2;cu++)for(const [c,st] of dp[cu])for(const o of g){const nc=c+o.c;if(nc>U)continue;
      const put=(cap,val,took)=>{const m=nd[cap],cur=m.get(nc);if(!cur||cur.v<val)m.set(nc,{v:val,pick:[...st.pick,{o,took}]})};put(cu,st.v+o.p,false);if(!cu)put(1,st.v+o.pc,true)}dp=nd}
  let best=null;for(const m of dp)for(const s of m.values())if(!best||s.v>best.v)best=s;return best}

   <div style="display:grid;gap:8px">${B5S.map((pos,i)=>{const id=st.ids[i];if(id==null||!PL[id])return`<div class="slot"><span class="pos">${t('pos_'+pos)}</span><span></span><span class="muted">—</span><span></span><button class="btn" data-b5pick="${i}">${esc(t('pick'))}</button></div>`;const p=PL[id];return`<div class="slot on"><span class="pos">${t('pos_'+pos)}</span>${av(p)}<span style="min-width:0"><span class="nm" style="display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</span><span class="small muted">${price(id).toFixed(1)}m · ${A[id].pts} ${esc(t('pts'))}</span></span><button class="cap" data-cap="${i}" aria-pressed="${st.cap===i}" aria-label="Captain">★</button><button class="btn" data-b5rm="${i}">${esc(t('remove'))}</button></div>`}).join('')}</div>

async function claudeSample(){try{return window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){return null}}
async function aiCall(messages,signal,onText){
  try{return await aiFree(messages,signal,onText)}catch(e){if(e&&e.name==='AbortError')throw e;const sm=await claudeSample();if(!sm)throw e;
    const turns=[{role:'user',content:messages[0].content},...messages.slice(1).map(m=>({role:m.role,content:m.content}))];
    try{const r=await sm(turns,{modelTier:'quick',cache:false,signal,onText:({text})=>onText(text)});return r.text}catch(err){if(err&&err.code==='cancelled'){const ab=new Error('abort');ab.name='AbortError';throw ab}throw err}}}
async function aiFree(messages,signal,onText){
  const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages,stream:true,referrer:'pitchrank'}),signal});
  if(!r.ok)throw new Error('http '+r.status);
  const ct=r.headers.get('content-type')||'';
  if(!r.body||!ct.includes('event-stream')){const j=await r.json();const tx=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'';onText(tx);return tx}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',text='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const ln=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!ln.startsWith('data:'))continue;const d=ln.slice(5).trim();if(d==='[DONE]')continue;
      try{const j=JSON.parse(d);const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c){text+=c;onText(text)}}catch(e){}}}
  return text}
async function ask(q){if(S.view!=='ask')go('ask');if(ctlChat){ctlChat.abort();ctlChat=null}
  S.chat.push({role:'user',content:q});vAsk($('#app'));const log=$('#log'),bub=document.createElement('div');bub.className='bub ai wait';bub.textContent=t('thinking');log.appendChild(bub);log.scrollTop=log.scrollHeight;
  const btn=$('#cs');btn.textContent=t('ask_stop');btn.type='button';const ctl=new AbortController();ctlChat=ctl;btn.onclick=()=>ctl.abort();
  const done=()=>{if(ctlChat===ctl)ctlChat=null;const b=$('#cs');if(b){b.textContent=t('ask_send');b.type='submit';b.onclick=null}};
  const messages=[{role:'system',content:rules()+'\n\nPITCHRANK DATA\n'+aiContext(S.chat.filter(m=>m.role==='user').slice(-2).map(m=>m.content).join(' '))},...S.chat.slice(-8)];
  const onText=text=>{bub.className='bub ai';bub.innerHTML=md(text);log.scrollTop=log.scrollHeight};
  try{const text=await aiCall(messages,ctl.signal,onText);if(!text.trim())throw new Error('empty');onText(text);S.chat.push({role:'assistant',content:text})}
  catch(e){if(e&&e.name==='AbortError'){if(bub.className==='bub ai'&&bub.textContent)S.chat.push({role:'assistant',content:bub.textContent});else bub.remove()}
    else{bub.remove();const n=document.createElement('div');n.className='bub sys';n.textContent=t('ask_err');log.appendChild(n);S.chat.pop()}}
  done()}

const GT_CODE={'pt-BR':'pt','he':'iw','mni-Mtei':'mni-Mtei','fa-AF':'fa-AF'};
async function gtBatch(lines,tl){const prot=x=>x.replace(/\{(\w+)\}/g,'<x$1>'),unprot=x=>x.replace(/<\s*x\s*(\w+)\s*>/gi,'{$1}');
  const body=new URLSearchParams();body.set('q',lines.map(prot).join('\n'));
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&dt=t&tl='+encodeURIComponent(tl),{method:'POST',body});if(!r.ok)throw new Error('gt '+r.status);
  const j=await r.json();const out=(j[0]||[]).map(x=>x[0]||'').join('').split('\n').map(x=>unprot(x.trim()));
  if(out.length!==lines.length)throw new Error('split');return out}
async function translateDict(code){const tl=GT_CODE[code]||code;const keys=Object.keys(EN).filter(k=>k!=='sport');const vals=keys.map(k=>EN[k].replace(/\n/g,' '));
  const batches=[];let cur=[],len=0;for(let i=0;i<vals.length;i++){if(len+vals[i].length>3500&&cur.length){batches.push(cur);cur=[];len=0}cur.push(i);len+=vals[i].length+1}if(cur.length)batches.push(cur);
  const d={};const res=await Promise.all(batches.map(async b=>{try{return await gtBatch(b.map(i=>vals[i]),tl)}catch(e){return await Promise.all(b.map(i=>gtBatch([vals[i]],tl).then(x=>x[0]).catch(()=>vals[i])))}}));
  batches.forEach((b,bi)=>b.forEach((i,k)=>{d[keys[i]]=res[bi][k]||EN[keys[i]]}));
  try{const sp=await gtBatch(['Football'],tl);d.sport=sp[0]?sp[0].charAt(0).toUpperCase()+sp[0].slice(1):'Football'}catch(e){d.sport='Football'}
  if(Object.keys(d).filter(k=>d[k]!==EN[k]).length<10)throw new Error('no translation');return d}

  if(d.fcap!==undefined){const fd=fdraft();fd.cap=fd.squad[+d.fcap];S.fsel=null;vFantasy($('#app'));return}
  if(d.frm!==undefined){const fd=fdraft(),k=+d.frm;if(fd.cap===fd.squad[k])fd.cap=null;fd.squad[k]=null;vFantasy($('#app'));return}
  if(d.fswap){const [k,j]=d.fswap.split(':').map(Number);const fd=fdraft();fd.bench=fd.bench.map(x=>x===k?j:x===j?k:x);if(fd.cap===fd.squad[k]&&fd.bench.includes(k))fd.cap=null;S.fsel=null;vFantasy($('#app'));return}
  if(d.scope!==undefined){S.since=+d.scope;HL_POOL=null;PRICE=null;S.heroSel=0;S.bLimit=50;render();return}
  if(d.go){go(d.go);return}
  if(d.follow){const id=+d.follow;FOLLOW.has(id)?FOLLOW.delete(id):FOLLOW.add(id);ls.set('pr2_follow',JSON.stringify([...FOLLOW]));el.setAttribute('aria-pressed',FOLLOW.has(id));return}
  if(d.hsel!==undefined){S.heroSel=+d.hsel;document.querySelectorAll('.rk').forEach((b,i)=>b.setAttribute('aria-selected',i===S.heroSel));const top=board({age:S.heroAge,limit:10});$('#spot').innerHTML=spotlight(top[S.heroSel]);if(matchMedia('(max-width:980px)').matches)$('#spot').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.p!==undefined){openPlayer(+d.p);return}
  if(d.team){openTeam(+d.team);return}
  if(d.lg!==undefined){openLeague(+d.lg);return}
  if(d.hage){S.heroAge=d.hage;S.heroSel=0;vHome($('#app'));return}
  if(d.board){closeSheet();S.bf={stat:'pts',age:'all',league:'all',pos:'all',comp:'all',...JSON.parse(d.board)};S.bLimit=50;go('table');return}
  if(d.bf){S.bf[d.bf]=d.v;S.bLimit=50;vTable($('#app'));return}
  if(d.bage){S.bf.age=d.bage;S.bLimit=50;vTable($('#app'));return}
  if(d.xage){S.xi.age=d.xage;vXI($('#app'));return}
  if(d.xmode){S.xi.mode=d.xmode;vXI($('#app'));return}
  if(d.cmp!==undefined){closeSheet();const id=+d.cmp;const other=S.cmp[0]!=null&&S.cmp[0]!==id?S.cmp[0]:board({limit:2}).find(a=>a.p.i!==id).p.i;S.cmp=[id,other];go('compare');return}
  if(d.askp!==undefined){closeSheet();ask(`How is ${PL[+d.askp].name} doing this season on PitchRank, and what kind of player is he?`);return}
  if(d.hl){const h=S.hl;const ok=d.hl==='hi'?h.b.pts>=h.a.pts:h.b.pts<=h.a.pts;h.done=ok?'right':'wrong';if(ok){h.streak++;if(h.streak>h.best){h.best=h.streak;ls.set('pr2_hl',String(h.best))}}vGames($('#app'));return}
  if(d.b5pick!==undefined){b5picker(+d.b5pick);return}
  if(d.b5rm!==undefined){const st=b5(),i=+d.b5rm;st.ids[i]=null;if(st.cap===i)st.cap=null;b5save();vGames($('#app'));return}
  if(d.b5set){const [i,id]=d.b5set.split(':').map(Number);b5().ids[i]=id;b5save();vGames($('#app'));return}
  if(d.cap!==undefined){const st=b5(),i=+d.cap;st.cap=st.cap===i?null:i;b5save();vGames($('#app'));return}
  if(d.sugg){ask(d.sugg);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#scrim')&&!$('#scrim').dataset.locked)closeSheet()});
$('#brand').onclick=()=>go('home');$('#fab').onclick=()=>go('ask');$('#langBtn').onclick=()=>langSheet(false);
$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';ls.set('pr2_theme',r.dataset.theme)};
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==S.view){S.view=v;render()}});

/* =============== boot =============== */
const th=ls.get('pr2_theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
const hv=location.hash.slice(1);S.view=VIEWS.includes(hv)?hv:'home';
const saved=ls.get('pr2_lang');if(saved&&LANGS.some(l=>l.code===saved)){LANG=LANGS.find(l=>l.code===saved);DICT=BUILTIN[saved]||(()=>{try{return JSON.parse(ls.get('pr3_dict_'+saved)||'null')||{}}catch(e){return{}}})()}
chrome();$('#app .loading div:last-child').textContent=t('loading');
fetch('data.json?v='+Math.floor(Date.now()/9e5)).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(raw=>{decode(raw);render();if(!LANG)langSheet(true)}).catch(()=>{$('#app').innerHTML=`<div class="loading">${esc(t('load_err'))}</div>`});
})();
</script>
